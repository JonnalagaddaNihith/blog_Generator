services:
  postgres:
    image: postgres:15-alpine
    container_name: blog_generator_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog_generator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: blog_generator_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5



  searxng:
    image: searxng/searxng:latest
    container_name: blog_generator_searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog_generator_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/blog_generator
      - DATABASE_SYNC_URL=postgresql://postgres:postgres@postgres:5432/blog_generator
      - REDIS_URL=redis://redis:6379/0
      - SEARXNG_URL=http://searxng:8080
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_TEXT_MODEL=deepseek/deepseek-v4-pro-0813
      - OPENROUTER_IMAGE_MODEL=qwen/qwen-image-2.1-turbo
      - LANGGRAPH_CHECKPOINT_TYPE=postgres
      - STORAGE_IMAGES_PATH=./storage/images
      - STORAGE_PDFS_PATH=./storage/pdfs
      - LOG_LEVEL=INFO
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
    volumes:
      - ./storage:/app/storage
      - ./alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

volumes:
  postgres_data:
  redis_data:
