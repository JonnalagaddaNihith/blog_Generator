services:
  postgres:
    image: postgres:15-alpine
    container_name: blog_generator_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog_generator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: blog_generator_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5



  searxng:
    image: searxng/searxng:latest
    container_name: blog_generator_searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL}
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog_generator_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_SYNC_URL=${DATABASE_SYNC_URL}
      - REDIS_URL=${REDIS_URL}
      - SEARXNG_URL=${SEARXNG_URL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_TEXT_MODEL=${OPENROUTER_TEXT_MODEL}
      - OPENROUTER_IMAGE_MODEL=${OPENROUTER_IMAGE_MODEL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LANGGRAPH_CHECKPOINT_TYPE=${LANGGRAPH_CHECKPOINT_TYPE}
      - STORAGE_IMAGES_PATH=${STORAGE_IMAGES_PATH}
      - STORAGE_PDFS_PATH=${STORAGE_PDFS_PATH}
      - LOG_LEVEL=${LOG_LEVEL}
      - APP_HOST=${APP_HOST}
      - APP_PORT=${APP_PORT}
    volumes:
      - ./storage:/app/storage
      - ./alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

volumes:
  postgres_data:
  redis_data:
